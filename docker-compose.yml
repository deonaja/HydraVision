services:
  db:
    image: mysql:8.0
    container_name: hydravision-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hydravision
      MYSQL_USER: hydravision
      MYSQL_PASSWORD: hydravision_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hydravision-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: hydravision
      DB_USERNAME: hydravision
      DB_PASSWORD: hydravision_secret
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hydravision-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  phpmyadmin:
    image: phpmyadmin:5
    container_name: hydravision-phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: hydravision
      PMA_PASSWORD: hydravision_secret
    ports:
      - "8080:80"

volumes:
  mysql_data:
  backend_vendor:
  frontend_node_modules:
